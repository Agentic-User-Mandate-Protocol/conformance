[project]
name = "aump-conformance"
version = "0.1.0"
description = "Conformance runner and fixture corpus for the Agentic User Mandate Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Agentic User Mandate Protocol Authors" }
]
dependencies = [
  "jsonschema>=4.23.0"
]

[project.scripts]
aump-conformance = "aump_conformance.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.14.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aump_conformance"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
