[project]
name = "aump-conformance"
version = "0.1.0"
description = "Conformance runner and fixture corpus for the Agentic User Mandate Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "ai", "mandates", "protocol", "conformance"]
authors = [
  { name = "Agentic User Mandate Protocol Authors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing"
]
dependencies = [
  "jsonschema>=4.23.0"
]

[project.urls]
Homepage = "https://usermandateprotocol.com/"
Documentation = "https://usermandateprotocol.com/conformance/"
Repository = "https://github.com/Agentic-User-Mandate-Protocol/conformance"
Issues = "https://github.com/Agentic-User-Mandate-Protocol/conformance/issues"

[project.scripts]
aump-conformance = "aump_conformance.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.14.0",
  "twine>=6.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aump_conformance"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "aump_conformance/fixtures"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
