name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test native Go runner
        run: go test ./...

      - name: Run native conformance suite
        run: go run ./cmd/aump-conformance validate fixtures --format json --output report-go.json

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Run conformance suite
        run: uv run aump-conformance validate --format json --output report-python.json

      - name: Build Python package
        run: uv build

      - name: Check Python package
        run: uv run twine check dist/*

      - name: Smoke install Python package
        run: |
          python -m venv /tmp/aump-conformance-smoke
          /tmp/aump-conformance-smoke/bin/python -m pip install dist/*.whl
          /tmp/aump-conformance-smoke/bin/aump-conformance validate
