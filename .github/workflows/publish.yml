name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run pytest

      - run: go test ./...

      - run: go run ./cmd/aump-conformance validate fixtures

      - run: uv build

      - run: uv run twine check dist/*

      - name: Smoke install wheel
        run: |
          python -m venv /tmp/aump-conformance-smoke
          /tmp/aump-conformance-smoke/bin/python -m pip install dist/*.whl
          /tmp/aump-conformance-smoke/bin/aump-conformance validate

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
